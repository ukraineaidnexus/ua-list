description_en: "UA-DE e.V. is a German-Ukrainian humanitarian organisation delivering direct aid to war-affected communities in Ukraine. Working together with trusted local partners, we provide humanitarian relief, medical equipment, emergency supplies, vehicles, power solutions, and support for vulnerable people and animals. Our focus is on fast, transparent and needs-based assistance reaching communities close to the front line."
description_de: "UA-DE e.V. ist eine deutsch-ukrainische Hilfsorganisation, die Menschen in den vom Krieg betroffenen Regionen der Ukraine direkt unterstützt. Gemeinsam mit lokalen Partnern leisten wir humanitäre Hilfe, liefern medizinische Ausstattung, Fahrzeuge, Notfallhilfen sowie Energie- und Wiederaufbauprojekte und unterstützen besonders gefährdete Menschen und Tiere."
description_ua: "UA-DE e.V. — німецько-українська гуманітарна організація, що надає пряму допомогу постраждалим від війни громадам України. Разом із місцевими партнерами ми доставляємо гуманітарну допомогу, медичне обладнання, транспорт, аварійне забезпечення, енергетичні рішення та підтримуємо найбільш вразливих людей і тварин."
